name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    env:
      CI: true
      DATABASE_URL: file:./data/ci.db
      GOOGLE_MAPS_API_KEY: ""
      AUTH_SECRET: ci-only-not-for-production-use-32
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run smoke

  security:
    name: Security regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run security

  d1_migrations:
    name: D1 migration replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run d1:migrate:test

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [node, cf]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:${{ matrix.target }}
      - if: matrix.target == 'node'
        run: npm run security:runtime

  gate:
    name: CI
    if: always()
    needs: [typecheck, smoke, security, d1_migrations, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        run: |
          test "${{ needs.typecheck.result }}" = "success"
          test "${{ needs.smoke.result }}" = "success"
          test "${{ needs.security.result }}" = "success"
          test "${{ needs.d1_migrations.result }}" = "success"
          test "${{ needs.build.result }}" = "success"

  deploy:
    name: Deploy Cloudflare
    if: >-
      needs.gate.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Isi GitHub secrets CLOUDFLARE_API_TOKEN dan CLOUDFLARE_ACCOUNT_ID. Token: dash.cloudflare.com → API tokens → Create Token → Edit Cloudflare Workers."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:cf
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply ternak-review --remote
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Check production health
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS --max-time 20 https://ternakreview.com/health | grep -q '"ok":true'; then
              echo "health ok"
              exit 0
            fi
            sleep 5
          done
          echo "health failed"
          exit 1
