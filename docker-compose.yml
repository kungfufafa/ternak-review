services:
  app:
    build: .
    init: true
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DEPLOY_TARGET: node
      DATABASE_URL: file:./data/prod.db
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - review-data:/app/data
      - review-backups:/app/backups
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  review-data:
  review-backups:
